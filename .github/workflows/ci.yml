name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar tests
        run: pytest -q

  release:
    name: Compilar y publicar
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Comprobar que el tag coincide con la versión
        shell: bash
        run: |
          VERSION=$(grep -oP 'PROJECT_VERSION = "\K[^"]+' app/backend/config/constants.py)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con PROJECT_VERSION ($VERSION)" >&2
            exit 1
          fi

      - name: Compilar
        run: python scripts/build.py

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/IberostarGestorPedidos-Setup.exe
            dist/IberostarGestorPedidos-Portable.zip
          generate_release_notes: true
